server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA：所有前端路由回落到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 与 vite dev 的代理保持同一套约定：前端统一打 /api，这里剥掉前缀转给后端。
    # 后端接口在根路径（/chat、/knowledge…），带着 /api 前缀直连会 404。
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 租户与用户身份必须透传，否则后端 fail-closed 会一律 400
        proxy_set_header X-Tenant-Id       $http_x_tenant_id;
        proxy_set_header X-User-Id         $http_x_user_id;

        # 🔴 SSE 流式对话必需：关缓冲、关 chunked 编码转换、拉长超时，
        #    否则 token 会被 nginx 攒着一次性吐出，流式效果全无。
        proxy_buffering    off;
        proxy_cache        off;
        chunked_transfer_encoding off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
